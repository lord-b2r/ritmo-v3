<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0a">
<title>Ritmo Manager v3</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#f7f7f5;--w:#fff;--b:#0a0a0a;--g1:#f0f0ee;--g2:#e5e5e2;--g3:#c8c8c4;--g4:#888;--g5:#555;--acc:#E8FF3A;--green:#1a5c38;--gbg:#d4f0e0;--gborder:#a8dfc0;--red:#7a1a1a;--rbg:#ffd6d6;--rborder:#ffb3b3;--orange:#92400e;--obg:#fef3c7;--blue:#1e3a8a;--bbg:#dbeafe;--f:'Inter',sans-serif;--r:10px;--rl:14px}
html,body{height:100%;background:var(--bg);font-family:var(--f);color:var(--b);overflow:hidden}
body{display:flex;flex-direction:column;max-width:430px;margin:0 auto}

/* LOCK */
#lock{position:fixed;inset:0;background:var(--b);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px}
#lock.h{display:none}
.lock-logo{width:52px;height:52px;background:var(--acc);border-radius:13px;display:flex;align-items:center;justify-content:center;margin-bottom:16px}
.lock-logo svg{width:28px;height:28px}
.lock-t{font-size:24px;font-weight:900;color:#fff;letter-spacing:-.5px;margin-bottom:4px}
.lock-s{font-size:13px;color:rgba(255,255,255,.35);margin-bottom:28px}
.mgr-grid{display:flex;flex-direction:column;gap:7px;width:100%;max-width:300px;margin-bottom:20px}
.mgr-row{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);border-radius:11px;padding:12px 14px;display:flex;align-items:center;gap:12px;cursor:pointer}
.mgr-row:active{background:rgba(255,255,255,.12)}
.mgr-av{width:36px;height:36px;border-radius:50%;background:var(--acc);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--b);flex-shrink:0}
.mgr-nm{font-size:14px;font-weight:600;color:#fff}
.mgr-tm{font-size:11px;color:rgba(255,255,255,.3)}
.pin-wrap{display:none;flex-direction:column;align-items:center;width:100%;max-width:300px}
.pin-wrap.show{display:flex}
.pin-back{background:none;border:none;color:rgba(255,255,255,.35);font-size:13px;font-weight:600;cursor:pointer;font-family:var(--f);margin-bottom:14px;align-self:flex-start}
.pin-inp{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:11px;padding:14px;color:#fff;font-size:24px;width:100%;outline:none;font-family:var(--f);text-align:center;letter-spacing:10px;margin-bottom:10px}
.pin-btn{width:100%;padding:14px;background:var(--acc);color:var(--b);border:none;border-radius:11px;font-size:14px;font-weight:700;cursor:pointer;font-family:var(--f)}
.pin-err{color:#f87171;font-size:12px;margin-top:6px;display:none}

/* APP */
#app{display:none;flex-direction:column;height:100%}
#app.v{display:flex}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 12px;background:var(--bg);flex-shrink:0}
.pg-date{font-size:26px;font-weight:800;letter-spacing:-.8px;line-height:1.1}
.pg-sub{font-size:12px;color:var(--g4);margin-top:2px}
.top-right{display:flex;align-items:center;gap:8px}
.slide-tabs{display:flex;background:var(--w);border:.5px solid var(--g2);border-radius:30px;padding:4px;margin:0 18px 0;flex-shrink:0}
.slide-tab{flex:1;text-align:center;padding:9px 6px;font-size:13px;font-weight:600;color:var(--g4);border-radius:26px;cursor:pointer;transition:all .2s;white-space:nowrap}
.slide-tab.on{background:var(--b);color:#fff;font-weight:700}
.sd{width:7px;height:7px;border-radius:50%;background:var(--g3)}
.sd.ok{background:#22c55e}.sd.err{background:var(--red)}.sd.ld{background:#fb923c;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.top-av{width:30px;height:30px;border-radius:50%;background:var(--acc);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--b);cursor:pointer}
.screens{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;margin-top:12px}
.scr{display:none;padding:0 18px 24px}.scr.on{display:block}


/* SHARED */
.sec-lbl{font-size:10px;font-weight:700;color:var(--g4);text-transform:uppercase;letter-spacing:.8px;margin:14px 0 8px}
.pill{display:inline-flex;font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px}
.pill.ok{background:var(--gbg);color:var(--green)}.pill.er{background:var(--rbg);color:var(--red)}.pill.wn{background:var(--obg);color:var(--orange)}.pill.nu{background:var(--g1);color:var(--g4)}.pill.bl{background:var(--bbg);color:var(--blue)}
.kgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.kgrid-4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;margin-bottom:14px}
.kc{background:var(--w);border:1px solid var(--g2);border-radius:var(--rl);padding:13px}
.kl{font-size:10px;font-weight:700;color:var(--g4);text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px}
.kv{font-size:28px;font-weight:800;letter-spacing:-1px;line-height:1}
.kv.g{color:var(--green)}.ks{font-size:11px;color:var(--g4);margin-top:2px}
.rf{background:var(--g1);border:1px solid var(--g2);border-radius:var(--r);padding:8px 14px;font-size:12px;font-weight:600;color:var(--g5);cursor:pointer;font-family:var(--f);display:inline-flex;align-items:center;gap:6px;margin-bottom:14px}

/* AGENT CARD */
.agc{background:var(--w);border:1px solid var(--g2);border-radius:var(--rl);margin-bottom:7px;overflow:hidden}
.agc.ms{border-color:var(--rborder);background:#fffaf8}
.agh{display:flex;align-items:center;gap:12px;padding:13px 14px;cursor:pointer}
.aga{width:38px;height:38px;border-radius:50%;background:var(--b);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0}
.aga.ms{background:var(--rbg);color:var(--red)}
.agi{flex:1;min-width:0}
.agn{font-size:13px;font-weight:700;margin-bottom:2px}
.agm{font-size:11px;color:var(--g4)}
.ags{font-size:26px;font-weight:800}
.ags.red{color:var(--red)}.ags.ora{color:#ea580c}.ags.grn{color:var(--green)}.ags.blue{color:#3b82f6}
.agb{padding:0 14px 14px;border-top:1px solid var(--g2);display:none}
.agb.op{display:block}
.chev{font-size:14px;color:var(--g3);transition:transform .2s}
.mgd{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:10px}
.mce{background:var(--g1);border-radius:var(--r);padding:7px 9px}
.mcl{font-size:9px;font-weight:700;color:var(--g4);text-transform:uppercase;letter-spacing:.4px;margin-bottom:2px}
.mcv{font-size:17px;font-weight:800}
.mcv.g{color:var(--green)}
.ni{background:var(--g1);border-radius:var(--r);padding:7px 10px;margin-bottom:5px;font-size:12px;color:var(--g5)}
.nil{font-size:9px;font-weight:700;color:var(--g4);text-transform:uppercase;letter-spacing:.4px;margin-bottom:2px}
.rch{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.rc{padding:4px 9px;border-radius:20px;font-size:11px;font-weight:700}
.rc.ok{background:var(--gbg);color:var(--green)}.rc.ko{background:var(--rbg);color:var(--red)}
.mj{font-size:12px;color:var(--g4);font-style:italic;margin-top:8px;padding-top:8px;border-top:1px solid var(--g2)}

/* OBJ BAR */
.obj-bar{background:rgba(255,255,255,.1);border-radius:4px;height:5px;overflow:hidden;margin-top:6px}
.obj-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,#4ade80,var(--acc))}
.obj-fill.over{background:linear-gradient(90deg,var(--acc),#fb923c)}

/* MOIS */
.mh{background:var(--b);border-radius:var(--rl);padding:16px;margin-bottom:14px}
.mh-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.mh-tl{font-size:13px;font-weight:600;color:#fff}
.mh-ts{font-size:11px;color:rgba(255,255,255,.3)}
.mh-score{font-size:48px;font-weight:900;letter-spacing:-2px;color:#4ade80;line-height:1}
.mh-sub{font-size:9px;color:rgba(255,255,255,.3);text-transform:uppercase;letter-spacing:.6px}
.mh-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.mhc{background:rgba(255,255,255,.07);border-radius:8px;padding:9px}
.mhl{font-size:9px;color:rgba(255,255,255,.3);text-transform:uppercase;letter-spacing:.4px;margin-bottom:2px}
.mhv{font-size:20px;font-weight:800;color:#fff}
.mhv.g{color:#4ade80}
.bb{background:rgba(255,255,255,.1);border-radius:4px;height:6px;overflow:hidden}
.bf{height:100%;border-radius:4px;background:#4ade80}

/* CLASSEMENT */
.rk{background:var(--w);border:1px solid var(--g2);border-radius:var(--rl);overflow:hidden}
.rr{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--g1);cursor:pointer}
.rr:last-child{border-bottom:0}
.rn{font-size:14px;font-weight:800;color:var(--g3);min-width:18px}
.rn.gd{color:#b8860b}
.ra{width:32px;height:32px;border-radius:50%;background:var(--b);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;flex-shrink:0}
.rf2{flex:1;min-width:0}
.rnm{font-size:13px;font-weight:700}
.rsb{font-size:11px;color:var(--g4)}
.rbb{background:var(--g1);border-radius:3px;height:4px;margin-top:4px}
.rbf{height:100%;border-radius:3px;background:var(--b)}
.rs{font-size:20px;font-weight:800}
.rs.red{color:var(--red)}.rs.ora{color:#ea580c}.rs.grn{color:var(--green)}.rs.blue{color:#3b82f6}

/* VENTES */
.vi{background:var(--w);border:1px solid var(--g2);border-radius:var(--rl);padding:11px 13px;margin-bottom:6px}
.vit{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.vin{font-size:13px;font-weight:700}
.via{font-size:11px;color:var(--g4);margin-bottom:6px}
.vig{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px}
.vc{background:var(--g1);border-radius:6px;padding:6px 8px}
.vcl{font-size:9px;font-weight:700;color:var(--g4);text-transform:uppercase;letter-spacing:.3px}
.vcv{font-size:13px;font-weight:700}
.vk{background:var(--w);border:1px solid var(--g2);border-radius:var(--rl);padding:12px}
.vkl{font-size:10px;font-weight:700;color:var(--g4);text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px}
.vkv{font-size:22px;font-weight:800;letter-spacing:-.5px}
.vks{font-size:11px;color:var(--g4);margin-top:2px}
.filter-row{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.fb{padding:6px 13px;border-radius:20px;border:1px solid var(--g2);background:var(--w);font-size:12px;font-weight:700;color:var(--g4);cursor:pointer;font-family:var(--f)}
.fb.on{background:var(--b);color:#fff;border-color:var(--b)}

/* MUR */
.mur-item{background:var(--w);border:1px solid var(--g2);border-radius:var(--rl);padding:14px;margin-bottom:8px}
.mur-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.mur-av{width:34px;height:34px;border-radius:50%;background:var(--b);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;flex-shrink:0}
.mur-info{flex:1}
.mur-name{font-size:13px;font-weight:700}
.mur-meta{font-size:11px;color:var(--g4)}
.mur-score{font-size:22px;font-weight:800}
.mur-score.red{color:var(--red)}.mur-score.ora{color:#ea580c}.mur-score.grn{color:var(--green)}
.mur-text{font-size:14px;color:var(--b);line-height:1.5;padding:10px;background:var(--g1);border-radius:var(--r);font-style:italic}

.empty{text-align:center;padding:40px 0;font-size:13px;font-weight:600;color:var(--g3)}
.sub-tabs{display:flex;background:var(--g1);border-radius:30px;padding:3px;margin-bottom:14px;flex-shrink:0}
.sub-tab{flex:1;text-align:center;padding:8px 10px;font-size:13px;font-weight:600;color:var(--g4);border-radius:26px;cursor:pointer;transition:all .2s}
.sub-tab.on{background:var(--b);color:#fff;font-weight:700}
.sub-scr{display:none}.sub-scr.on{display:block}
.fu-cat{display:inline-flex;padding:3px 8px;border-radius:20px;font-size:10px;font-weight:700}
.fu-rdv{background:rgba(59,130,246,.15);color:#1d4ed8}
.fu-fu{background:rgba(245,158,11,.15);color:#92400e}
.fu-mgm{background:rgba(16,185,129,.15);color:#065f46}
.fu-card{background:var(--w);border:1px solid var(--g2);border-radius:var(--rl);margin-bottom:8px;overflow:hidden}
.fu-agent-hd{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;border-bottom:1px solid var(--g1)}
.fu-agent-body{display:none;padding:10px 14px 14px}
.fu-agent-body.op{display:block}
.fu-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--g1)}
.fu-row:last-child{border-bottom:0}
.fu-nom{font-size:13px;font-weight:600;flex:1}
.fu-note{font-size:11px;color:var(--g4);margin-top:2px}
.fu-type{font-size:10px;font-weight:700;color:var(--g3)}
</style>
</head>
<body>

<!-- LOCK -->
<div id="lock">
  <div class="lock-logo"><svg viewBox="0 0 28 28" fill="none"><rect x="2" y="2" width="10" height="10" rx="2" fill="#0a0a0a"/><rect x="16" y="2" width="10" height="10" rx="2" fill="#0a0a0a"/><rect x="2" y="16" width="10" height="10" rx="2" fill="#0a0a0a"/><rect x="16" y="16" width="10" height="10" rx="2" fill="#0a0a0a" opacity=".3"/></svg></div>
  <div class="lock-t">Ritmo Manager</div>
  <div class="lock-s">Selectionne ton profil</div>
  <div class="mgr-grid" id="mgr-grid"></div>
  <div class="pin-wrap" id="pin-wrap">
    <button class="pin-back" onclick="backSel()">Retour</button>
    <input class="pin-inp" type="password" id="pin-inp" placeholder="****" maxlength="4" onkeydown="if(event.key==='Enter')chkPin()">
    <button class="pin-btn" onclick="chkPin()">Acceder</button>
    <div class="pin-err" id="pin-err">Code incorrect</div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <!-- TOPBAR -->
  <div class="topbar">
    <div>
      <div class="pg-date" id="pg-date"></div>
      <div class="pg-sub" id="pg-team"></div>
    </div>
    <div class="top-right">
      <div class="sd ld" id="sd"></div>
      <div class="top-av" id="top-av" onclick="logout()"></div>
    </div>
  </div>

  <!-- SLIDING TABS -->
  <div class="slide-tabs">
    <div class="slide-tab on" id="t-today" onclick="sw('today')">Aujourd hui</div>
    <div class="slide-tab" id="t-month" onclick="sw('month')">Ce mois</div>
    <div class="slide-tab" id="t-ventes" onclick="sw('ventes')">Ventes</div>
    <div class="slide-tab" id="t-mur" onclick="sw('mur')">Mur</div>
  </div>

  <div class="screens">

    <!-- AUJOURD HUI -->
    <div id="s-today" class="scr on">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
        <button class="rf" onclick="loadData()"><i class="ti ti-refresh" style="font-size:13px"></i> Actualiser</button>
        <div id="date-nav" style="display:flex;align-items:center;gap:4px"></div>
      </div>
      <div id="today-kpis"></div>
      <div id="miss-banner" style="display:none"></div>
      <div class="sec-lbl">Equipe - EOD du jour</div>
      <div id="agents-today"></div>
    </div>

    <!-- MOIS -->
    <div id="s-month" class="scr">
      <div id="month-hero"></div>
      <div class="sec-lbl">Classement mensuel</div>
      <div class="rk" id="ranking"></div>
    </div>

    <!-- VENTES + FU -->
    <div id="s-ventes" class="scr">
      <div class="sub-tabs">
        <div class="sub-tab on" id="st-ventes" onclick="swSub('ventes')">Ventes</div>
        <div class="sub-tab" id="st-fu" onclick="swSub('fu')">Follow-up</div>
      </div>
      <!-- Sous-ecran Ventes -->
      <div id="ss-ventes" class="sub-scr on">
        <div class="filter-row" id="sales-filter"></div>
        <div class="filter-row" id="type-filter">
          <button class="fb on" onclick="setTypeFilter('all')">Toutes</button>
          <button class="fb" onclick="setTypeFilter('POS')">POS</button>
          <button class="fb" onclick="setTypeFilter('TPE')">TPE</button>
        </div>
        <div class="kgrid" id="ventes-kpi"></div>
        <div id="ventes-list"></div>
      </div>
      <!-- Sous-ecran Follow-up -->
      <div id="ss-fu" class="sub-scr">
        <div id="fu-summary"></div>
        <div id="fu-list-mgr"></div>
      </div>
    </div>

    <!-- MUR -->
    <div id="s-mur" class="scr">
      <div style="font-size:18px;font-weight:800;letter-spacing:-.3px;margin-bottom:4px">Bonnes nouvelles</div>
      <div style="font-size:13px;color:var(--g4);margin-bottom:16px">Ce que les equipes partagent ce mois-ci</div>
      <div id="mur-list"></div>
    </div>

  </div>
</div>

<!-- EOD MODAL -->
<div id="eod-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:500;overflow-y:auto;padding:20px 16px">
  <div style="background:var(--w);border-radius:var(--rl);max-width:400px;margin:0 auto;overflow:hidden">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--g2)">
      <div id="modal-agent" style="font-size:14px;font-weight:700"></div>
      <button onclick="closeModal()" style="background:var(--g1);border:none;border-radius:50%;width:30px;height:30px;cursor:pointer;font-size:16px;color:var(--g4)">x</button>
    </div>
    <div id="modal-content" style="padding:16px"></div>
  </div>
</div>

<script>
var MANAGERS = {
  jean:    {name:'Jean',            initials:'JE', pin:'2024', team:'jean',     label:'Equipe Jean'},
  romeo:   {name:'Romeo',           initials:'RO', pin:'2025', team:'romeo',    label:'Equipe Romeo'},
  quentin: {name:'Quentin',         initials:'QU', pin:'2026', team:'quentin',  label:'Equipe Quentin'},
  cem:     {name:'Cem',             initials:'CE', pin:'2027', team:'cem',      label:'Equipe Cem'},
  idris:   {name:'Idris ENE',       initials:'IE', pin:'2028', team:'idris',    label:'Equipe Idris'},
  arsena:  {name:'Arsena VADAHI',   initials:'AV', pin:'2029', team:'arsena',   label:'Equipe Arsena'},
  axel_l:  {name:'Axel LUXEMBOURG', initials:'AL', pin:'2031', team:'axel_l',   label:'Equipe Axel L.'},
  julien_r:{name:'Julien ROUXEL',   initials:'JR', pin:'2032', team:'julien_r', label:'Equipe Julien R.'},
  benjamin:{name:'Benjamin CLEMENT',initials:'BC', pin:'2033', team:'benjamin', label:'Equipe Benjamin'},
  alex_g: {name:'Alexandre GLADEL', initials:'AG', pin:'2034', team:'alex_g',  label:'Equipe Alex G.'}
};


var TEAMS = {
  jean:    [{n:'Manon LAURENT',i:'ML'},{n:'Jonathan KHAROUBI',i:'JK'},{n:'Aurelie QUINCHARD',i:'AQ'},{n:'Mathias AZZOPARDI',i:'MA'},{n:'Menelik KETCHAM',i:'MK'},{n:'Alban HIGEL',i:'AH'},{n:'Jimmy LEVACHER',i:'JL'},{n:'Pierre FAUCHEUX',i:'PF'},{n:'David JESNE',i:'DJ'}],
  romeo:   [{n:'Kelly HOCHET',i:'KH'},{n:'Bastien GEIGER',i:'BG'},{n:'Lea RECORDIER',i:'LR'},{n:'Hugo LAUGIER',i:'HL'},{n:'Raphael BOUTEILLE',i:'RB'},{n:'Linda MEBAREK',i:'LM'}],

function renderMonth(){
  var agents=getTeamAgents('own');
  var month=now.toISOString().slice(0,7);
  var stats=agents.map(function(ag){
    var r=getMonth(ag.n);
    // Regularite : jours ouvrés du mois - EODs manquantes
    var d=now.getDate();
    var workedDays=Math.ceil(d*WORK_DAYS_PER_MONTH/30);
    var sentDays=new Set(r.map(function(x){return new Date(x.timestamp).toDateString();})).size;
    var missing=Math.max(0,workedDays-sentDays);
    var regPct=workedDays>0?Math.round(sentDays/workedDays*100):0;
    var regColor=missing>=5?'var(--red)':missing>=3?'#fb923c':'var(--green)';
    return{ag:ag,s:r.reduce(function(x,y){return x+(y.score||0);},0),v:r.reduce(function(x,y){return x+(y.total_vente||0);},0),ins:r.reduce(function(x,y){return x+(y.instal||0);},0),pos:r.reduce(function(x,y){return x+(y.total_pos||0);},0),n:r.length,missing:missing,regPct:regPct,regColor:regColor,workedDays:workedDays};
  });
  var ts=stats.reduce(function(x,a){return x+a.s;},0);
  var tv=stats.reduce(function(x,a){return x+a.v;},0);
  var ti=stats.reduce(function(x,a){return x+a.ins;},0);
  var tp=stats.reduce(function(x,a){return x+a.pos;},0);
  var pp=tv>0?Math.round(tp/tv*100):0;
  var mn=now.toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
  var h=document.getElementById('month-hero');h.innerHTML='';
  var objTotal=OBJ_POINTS*agents.length;
  var objPct=objTotal>0?Math.round(ts/objTotal*100):0;
  var mhd=document.createElement('div');mhd.className='mh';
  var top2=document.createElement('div');top2.className='mh-top';
  var left=document.createElement('div');
  left.innerHTML='<div class="mh-tl">'+MANAGERS[ME].label+'</div><div class="mh-ts">'+mn.charAt(0).toUpperCase()+mn.slice(1)+'</div>';
  var right=document.createElement('div');right.style.textAlign='right';
  right.innerHTML='<div class="mh-score">'+ts+'</div><div style="font-size:11px;color:rgba(255,255,255,.35);margin-top:2px">/ '+objTotal+' pts objectif</div>';
  top2.appendChild(left);top2.appendChild(right);
  var mg=document.createElement('div');mg.className='mh-grid';
  var trdvIhM=agents.flatMap(function(a){return getMonth(a.n);}).reduce(function(s,r){return s+(r.rdv_ih||0);},0);
  var trdvOgM=agents.flatMap(function(a){return getMonth(a.n);}).reduce(function(s,r){return s+(r.rdv_og||0);},0);
  var tacM=agents.flatMap(function(a){return getMonth(a.n);}).reduce(function(s,r){return s+(r.ac||0);},0);
  [['Ventes',tv,true],['Instals',ti,true],['POS share',pp+'%',pp>=50],['RDV IH',trdvIhM,false],['RDV OG',trdvOgM,false],['AC total',tacM,false]].forEach(function(c){
    var mc=document.createElement('div');mc.className='mhc';mc.innerHTML='<div class="mhl">'+c[0]+'</div><div class="mhv'+(c[2]?' g':'')+'">'+c[1]+'</div>';mg.appendChild(mc);
  });
  // Barre objectif avec légende
  var barWrap=document.createElement('div');
  barWrap.innerHTML='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px">'+
    '<span style="font-size:10px;color:rgba(255,255,255,.35)">Progression objectif equipe</span>'+
    '<span style="font-size:11px;font-weight:700;color:'+(objPct>=100?'#4ade80':objPct>=70?'#fb923c':'#f87171')+'">'+objPct+'%</span></div>'+
    '<div class="bb"><div class="bf" style="width:'+Math.min(objPct,100)+'%;background:'+(objPct>=100?'#4ade80':objPct>=70?'#fb923c':'#f87171')+'"></div></div>'+
    '<div style="display:flex;justify-content:space-between;margin-top:4px">'+
    '<span style="font-size:10px;color:rgba(255,255,255,.25)">'+ts+' pts atteints</span>'+
    '<span style="font-size:10px;color:rgba(255,255,255,.25)">Objectif : '+objTotal+' pts ('+agents.length+' x '+OBJ_POINTS+'pts)</span></div>';
  mhd.appendChild(top2);mhd.appendChild(mg);mhd.appendChild(barWrap);h.appendChild(mhd);

  var sorted=stats.slice().sort(function(a,b){return b.s-a.s;});
  var mx=Math.max(sorted[0]?sorted[0].s:1,1);
  var rk=document.getElementById('ranking');rk.innerHTML='';
  sorted.forEach(function(a,i){
    var cls=scC(a.s===0?0:a.s<=3?1:2);
    var posS=a.v>0?Math.round(a.pos/a.v*100):0;
    var row=document.createElement('div');row.className='rr';
    row.onclick=(function(ag,sts){return function(){openAgentDetail(ag,sts);};})(a.ag,a);
    var rn=document.createElement('div');rn.className='rn'+(i===0?' gd':'');rn.textContent=(i+1);
    var ra=document.createElement('div');ra.className='ra';ra.textContent=a.ag.i;
    var rf=document.createElement('div');rf.className='rf2';
    var rnm=document.createElement('div');rnm.className='rnm';rnm.textContent=a.ag.n.split(' ')[0];
    var rsb=document.createElement('div');rsb.className='rsb';rsb.textContent=a.v+' V - '+a.ins+' I - POS '+posS+'%';
    // Barre régularité
    var rbb=document.createElement('div');rbb.className='rbb';
    var rbf=document.createElement('div');rbf.className='rbf';rbf.style.cssText='height:100%;border-radius:3px;background:'+a.regColor+';width:'+a.regPct+'%';
    var regLbl=document.createElement('div');regLbl.style.cssText='font-size:9px;color:var(--g4);margin-top:2px';
    regLbl.textContent='Regularite: '+a.regPct+'%'+(a.missing>0?' ('+a.missing+' EOD manquante'+(a.missing>1?'s':'')+')'  :'');
    rbb.appendChild(rbf);
    rf.appendChild(rnm);rf.appendChild(rsb);rf.appendChild(rbb);rf.appendChild(regLbl);
    var rs=document.createElement('div');rs.className='rs '+cls;rs.textContent=a.s;
    row.appendChild(rn);row.appendChild(ra);row.appendChild(rf);row.appendChild(rs);rk.appendChild(row);
  });
}

function renderVentes(){
  var agents=getTeamAgents('own');
  if(salesFilter!=='all'){agents=agents.filter(function(a){return a.n===salesFilter;});}
  var month=now.toISOString().slice(0,7);
  var reps=REPORTS.filter(function(r){
    return agents.some(function(a){return a.n===r.agent;})&&r.timestamp&&new Date(r.timestamp).toISOString().slice(0,7)===month;
  });
  var allV=reps.reduce(function(acc,r){return acc.concat((r.ventes_detail||[]).filter(function(v){return v&&v.nom;}).map(function(v){return Object.assign({},v,{date:r.date,agent:r.agent});}));},  []);
  var filtered=typeFilter==='all'?allV:allV.filter(function(v){return (v.type||v.ty||'POS')===typeFilter;});
  var totalTPV=filtered.reduce(function(s,v){return s+(parseInt(v.tpv)||0);},0);
  var avgTaux=filtered.length?filtered.reduce(function(s,v){return s+(parseFloat(v.taux)||0);},0)/filtered.length:0;
  var totalUp=filtered.reduce(function(s,v){return s+(parseInt(v.upfront)||0);},0);
  var posV=filtered.filter(function(v){return (v.type||v.ty||'POS')==='POS';});
  var avgUpPos=posV.length?Math.round(posV.reduce(function(s,v){return s+(parseInt(v.upfront)||0);},0)/posV.length):0;
  var kpi=document.getElementById('ventes-kpi');kpi.innerHTML='';
  [['TPV total',formatK(totalTPV)+' EUR',''],['Taux moyen',avgTaux?avgTaux.toFixed(2)+'%':'---','Sur '+filtered.length+' ventes'],
   ['Upfront total',formatK(totalUp)+' EUR',''],['Upfront moy. POS',avgUpPos?formatK(avgUpPos)+' EUR':'0','Par vente POS']].forEach(function(c){
    var vk=document.createElement('div');vk.className='vk';vk.innerHTML='<div class="vkl">'+c[0]+'</div><div class="vkv">'+c[1]+'</div><div class="vks">'+c[2]+'</div>';kpi.appendChild(vk);
  });
  var list=document.getElementById('ventes-list');list.innerHTML='';
  if(!filtered.length){list.innerHTML='<div class="empty">Aucune vente</div>';return;}
  filtered.forEach(function(v){
    var tp=parseInt(v.tpv)||0,up=parseInt(v.upfront)||0,ty=v.type||v.ty||'POS';
    var ag=ALL_AGENTS.find(function(a){return a.n===v.agent;});
    var d=document.createElement('div');d.className='vi';
    var vit=document.createElement('div');vit.className='vit';
    var vin=document.createElement('span');vin.className='vin';vin.textContent=v.nom;
    var ty2=document.createElement('span');ty2.className='pill '+(ty==='POS'?'ok':'bl');ty2.textContent=ty;
    vit.appendChild(vin);vit.appendChild(ty2);
    var via=document.createElement('div');via.className='via';via.textContent=(ag?ag.n.split(' ')[0]:v.agent)+' - '+v.date;
    var vg=document.createElement('div');vg.className='vig';
    [['TPV',tp?formatK(tp)+' EUR':'---'],['Taux',v.taux?v.taux+'%':'---'],['Upfront',up?formatK(up)+' EUR':'0']].forEach(function(c){
      var vc=document.createElement('div');vc.className='vc';var vcl=document.createElement('div');vcl.className='vcl';vcl.textContent=c[0];var vcv=document.createElement('div');vcv.className='vcv';vcv.textContent=c[1];vc.appendChild(vcl);vc.appendChild(vcv);vg.appendChild(vc);
    });
    d.appendChild(vit);d.appendChild(via);d.appendChild(vg);list.appendChild(d);
  });
}

      var cnt=users.length?'<span style="font-size:11px;font-weight:700;color:'+(active?'#fff':'var(--g4)')+'">'+users.length+'</span>':'';

function openAgentDetail(ag,stats){
  document.getElementById('modal-agent').textContent=ag.n+' - '+now.toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
  var obj=OBJ_POINTS;
  var objPct=Math.min(Math.round(stats.s/obj*100),150);
  var posShare=stats.v>0?Math.round(stats.pos/stats.v*100):0;
  var html='<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:14px">';
  [['Score',stats.s,true],['Objectif',obj+' pts',false],['Ventes',stats.v,true],['Instals',stats.ins,true],['POS share',posShare+'%',posShare>=50],['Regularite',stats.regPct+'%',stats.missing===0]].forEach(function(c){
    html+='<div style="background:var(--g1);border-radius:8px;padding:9px 11px"><div style="font-size:9px;font-weight:700;color:var(--g4);text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px">'+c[0]+'</div><div style="font-size:20px;font-weight:800;'+(c[2]?'color:var(--green)':'')+'">'+c[1]+'</div></div>';
  });
  html+='</div>';
  if(stats.missing>0)html+='<div style="background:var(--rbg);border:1px solid var(--rborder);border-radius:var(--r);padding:8px 12px;font-size:12px;font-weight:700;color:var(--red);margin-bottom:12px">'+stats.missing+' EOD manquante'+(stats.missing>1?'s':'')+' ce mois</div>';
  var reps=getMonth(ag.n);
  html+='<div style="font-size:10px;font-weight:700;color:var(--g4);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px">EODs du mois ('+reps.length+')</div>';
  reps.slice(0,20).forEach(function(r){
    var s=r.score||0,cls=scC(s),tv=r.total_vente||0;
    var col=cls==='grn'?'var(--green)':cls==='ora'?'#ea580c':'var(--red)';
    html+='<div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--g1)">';
    html+='<div style="width:8px;height:8px;border-radius:50%;background:'+col+';flex-shrink:0"></div>';
    html+='<div style="flex:1"><div style="font-size:12px;font-weight:600">'+r.date+'</div><div style="font-size:11px;color:var(--g4)">'+tv+' V - '+(r.instal||0)+' I'+(r.mot_jour?' - "'+r.mot_jour.slice(0,30)+(r.mot_jour.length>30?'...':'')+'"':'')+'</div></div>';
    html+='<div style="font-size:16px;font-weight:800;color:'+col+'">'+s+'</div></div>';
  });
  document.getElementById('modal-content').innerHTML=html;
  document.getElementById('eod-modal').style.display='block';
}
function closeModal(){document.getElementById('eod-modal').style.display='none';}

async function loadFuItems(agents){
  try{
    var names=agents.map(function(a){return a.n;});
    var inFilter='('+names.map(function(n){return '"'+n+'"';}).join(',')+')';
    var url=SB+'/rest/v1/fu_items?agent=in.'+encodeURIComponent(inFilter)+'&done=eq.false&order=created_at.asc';
    var res=await fetch(url,{
      headers:{'apikey':SK,'Authorization':'Bearer '+SK}
    });
    if(res.ok){var data=await res.json();return data||[];}
    else{console.error('loadFuItems error',res.status,await res.text());}
  }catch(e){console.error('loadFuItems error',e);}
  return [];
}
function renderFU(){
  var agents=getTeamAgents('own');
  var summary=document.getElementById('fu-summary');
  var list=document.getElementById('fu-list-mgr');
  if(!summary||!list)return;
  summary.innerHTML='';list.innerHTML='<div class="empty">Chargement...</div>';
  loadFuItems(agents).then(function(fuData){
    renderFuContent(agents, fuData, summary, list);
  });
}
function renderFuContent(agents, fuData, summary, list){
  summary.innerHTML='';list.innerHTML='';
  var sumGrid=document.createElement('div');sumGrid.style.cssText='display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px';
  var hasFU=false;
  agents.forEach(function(ag){
    var agFu=fuData.filter(function(f){return f.agent===ag.n;});
    var nRdv=agFu.filter(function(f){return f.cat==='rdv';}).length;
    var nFu=agFu.filter(function(f){return f.cat==='fu';}).length;
    var nMgm=agFu.filter(function(f){return f.cat==='mgm';}).length;
    var total=agFu.length;
    if(total>0)hasFU=true;
    var kc=document.createElement('div');
    kc.style.cssText='background:var(--w);border:1px solid var(--g2);border-radius:var(--rl);padding:12px';
    kc.innerHTML='<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">'+
      '<div style="width:30px;height:30px;border-radius:50%;background:var(--b);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;flex-shrink:0">'+ag.i+'</div>'+
      '<div style="flex:1"><div style="font-size:13px;font-weight:700">'+ag.n.split(' ')[0]+'</div></div>'+
      '<div style="font-size:18px;font-weight:800;color:'+(total>0?'var(--green)':'var(--g3)')+'">'+total+'</div></div>'+
      '<div style="display:flex;gap:5px;flex-wrap:wrap">'+
      (nRdv?'<span class="fu-cat fu-rdv">'+nRdv+' RDV</span>':'')+
      (nFu?'<span class="fu-cat fu-fu">'+nFu+' FU</span>':'')+
      (nMgm?'<span class="fu-cat fu-mgm">'+nMgm+' MGM</span>':'')+
      (total===0?'<span style="font-size:11px;color:var(--g3)">Aucun FU</span>':'')+'</div>';
    sumGrid.appendChild(kc);
  });
  summary.appendChild(sumGrid);
  if(!hasFU){list.innerHTML='<div class="empty">Aucun follow-up renseigne</div>';return;}
  var lbl=document.createElement('div');lbl.className='sec-lbl';lbl.textContent='Detail par commercial';list.appendChild(lbl);
  agents.forEach(function(ag){
    var agFu=fuData.filter(function(f){return f.agent===ag.n;});
    if(!agFu.length)return;
    var nRdv=agFu.filter(function(f){return f.cat==='rdv';}).length;
    var nFu=agFu.filter(function(f){return f.cat==='fu';}).length;
    var nMgm=agFu.filter(function(f){return f.cat==='mgm';}).length;
    var card=document.createElement('div');card.className='fu-card';
    var key='fu_'+ag.n.replace(/[^a-z0-9]/gi,'_');
    var hd=document.createElement('div');hd.className='fu-agent-hd';
    hd.innerHTML='<div style="width:34px;height:34px;border-radius:50%;background:var(--b);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;flex-shrink:0">'+ag.i+'</div>'+
      '<div style="flex:1"><div style="font-size:13px;font-weight:700">'+ag.n+'</div>'+
      '<div style="display:flex;gap:5px;margin-top:4px">'+
      (nRdv?'<span class="fu-cat fu-rdv">'+nRdv+' RDV</span>':'')+
      (nFu?'<span class="fu-cat fu-fu">'+nFu+' FU</span>':'')+
      (nMgm?'<span class="fu-cat fu-mgm">'+nMgm+' MGM</span>':'')+'</div></div>'+
      '<i class="ti ti-chevron-down chev" id="chfu-'+key+'"></i>';
    hd.onclick=(function(k){return function(){
      var b=document.getElementById('b-'+k),c=document.getElementById('chfu-'+k);
      if(!b)return;var op=b.classList.contains('op');b.classList.toggle('op');
      if(c)c.style.transform=op?'':'rotate(180deg)';
    };})(key);
    var body=document.createElement('div');body.className='fu-agent-body';body.id='b-'+key;
    var cats={rdv:'fu-rdv',fu:'fu-fu',mgm:'fu-mgm'};
    var catLabels={rdv:'RDV',fu:'Follow-up',mgm:'MGM'};
    agFu.forEach(function(f){
      var row=document.createElement('div');row.className='fu-row';
      row.innerHTML='<span class="fu-cat '+(cats[f.cat]||'fu-fu')+'">'+catLabels[f.cat]+'</span>'+
        '<div style="flex:1"><div class="fu-nom">'+f.nom+'</div>'+(f.note?'<div class="fu-note">'+f.note+'</div>':'')+'</div>'+
        '<span class="fu-type">'+(f.type||'').toUpperCase()+'</span>';
      body.appendChild(row);
    });
    card.appendChild(hd);card.appendChild(body);list.appendChild(card);
  });
}


function sw(t){
  ['today','month','ventes','mur'].forEach(function(s){
    document.getElementById('s-'+s).className='scr'+(t===s?' on':'');
    document.getElementById('t-'+s).className='slide-tab'+(t===s?' on':'');
  });
  if(t==='ventes'){buildSalesFilter();renderVentes();}
  if(t==='mur')renderMur();
}
function swSub(t){
  ['ventes','fu'].forEach(function(s){
    var el=document.getElementById('ss-'+s);if(el)el.className='sub-scr'+(t===s?' on':'');
    var tab=document.getElementById('st-'+s);if(tab)tab.className='sub-tab'+(t===s?' on':'');
  });
  if(t==='fu')renderFU();
  if(t==='ventes'){buildSalesFilter();renderVentes();}
}

function formatK(n){return n>=1000000?(n/1000000).toFixed(1)+'M':n>=1000?(n/1000).toFixed(0)+'K':n.toString();}

if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(function(r){r.forEach(function(s){s.unregister();});});}
